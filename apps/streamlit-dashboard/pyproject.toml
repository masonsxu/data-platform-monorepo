[project]
name = "streamlit-dashboard"
version = "0.1.0"
description = "Streamlit dashboard (parallel to Vue dashboard, for tech comparison)"
requires-python = ">=3.12"
dependencies = [
    "data-core",
    "streamlit>=1.44",
    "plotly>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "streamlit_dashboard"
