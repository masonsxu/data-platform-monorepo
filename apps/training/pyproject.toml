[project]
name = "training"
version = "0.1.0"
description = "Model training (daily orders forecast) + batch scoring"
requires-python = ">=3.12"
dependencies = [
    "data-core",
    "numpy>=2.1",
    "polars>=1.20",
    "scikit-learn>=1.6",
    "mlflow>=2.20",
]

[project.scripts]
train = "training.train:main"
predict = "training.predict:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "training"
