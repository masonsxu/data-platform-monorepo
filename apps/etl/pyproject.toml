[project]
name = "etl"
version = "0.1.0"
description = "Demo data generation + ETL cleansing to Parquet lake"
requires-python = ">=3.12"
dependencies = [
    "data-core",
    "numpy>=2.1",
    "polars>=1.20",
    "openpyxl>=3.1",
    "fastexcel>=0.21.0",
]

[project.scripts]
gen-data = "etl.generate:main"
etl-clean = "etl.clean:main"
sr-load = "etl.load_starrocks:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "etl"
