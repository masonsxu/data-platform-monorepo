# 复制为 config/settings.toml 后修改; settings.toml 已 gitignore
# 环境变量优先级更高: DP_LAKE_ROOT / DP_SR_ENABLED / DP_SR_HOST ...

[lake]
# 本地目录模式(demo 默认, 零外部依赖)
root = "./lake"
# 对象存储模式: 配 s3:// 前缀 + 以下四项(AK/SK 建议走环境变量 DP_LAKE_AK/DP_LAKE_SK)
# root = "s3://dp-demo/lake"
# s3_endpoint = "http://minio.example.local:9000"
# s3_region = "us-east-1"

[starrocks]
# 本地 demo 保持 false: API 自动 DuckDB 直查湖
# 接入集群: enabled = true 并填连接信息; 之后 make sr-schema && make sr-load && make sr-verify
enabled = false
host = "127.0.0.1"
port = 9030
user = "root"
password = ""
database = "dp_dw"
