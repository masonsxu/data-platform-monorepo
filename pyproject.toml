[project]
name = "data-platform-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/etl", "apps/training", "apps/api", "apps/streamlit-dashboard", "packages/data-core"]

[tool.uv.sources]
data-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
